<!doctype html>
<!-- The source of og.png (1280x640), the picture shown when the site or the repository is shared.
     Everything that matters stays 80px from every edge. On the right, as on the page: a real screen
     of the app, the whole window shrunk once to exactly 440x275 so it stays sharp (media/og-app.png),
     with a real frame from a video it made in front of it
     (media/clip-blueprint.jpg, the same clip the page plays).
     To make it again, from the repo root, with Chrome:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1280,640 \
         --screenshot=install/site/og.png "file://$PWD/install/site/og-image.html"
     then copy it to .github/social-preview.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Open Sourcebook social image</title>
<style>
/* The app's own dark tokens (web/src/design/tokens.css). */
html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
body {
  position: relative;
  background: #0E1015;
  color: #E7E9EE;
  font-family: "Inter Variable", Inter, -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.words {
  position: absolute; left: 80px; top: 80px; bottom: 80px; width: 580px;
  display: flex; flex-direction: column; justify-content: space-between;
}
.brand { display: flex; align-items: center; gap: 18px; }
.brand svg { width: 64px; height: 64px; }
.name { font-size: 44px; line-height: 1; font-weight: 800; letter-spacing: -0.03em; }
.name span { color: #FFB020; }
h1 { margin: 0; font-size: 60px; line-height: 1.03; font-weight: 700; letter-spacing: -0.045em; }
p { margin: 0; font-size: 28px; line-height: 1.3; font-weight: 600; letter-spacing: -0.015em; color: #ABB3C1; }

/* The app window, with the clip in front of its lower left corner */
.window {
  position: absolute; right: 80px; top: 110px; width: 440px; height: 275px;
  border-radius: 14px; overflow: hidden; border: 1px solid #2A2F3A; background: #0E1015;
}
.window img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top left; }
.clip {
  position: absolute; left: 700px; bottom: 80px; width: 180px; height: 320px;
  border-radius: 18px; overflow: hidden;
  border: 4px solid #0E1015; box-shadow: 0 2px 6px rgb(0 0 0 / .5), 0 18px 40px rgb(0 0 0 / .55);
}
.clip img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <div class="words">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#6C5CE7"/><path d="M7 22V10c3-1.5 6-1.5 9 0 3-1.5 6-1.5 9 0v12c-3-1.5-6-1.5-9 0-3-1.5-6-1.5-9 0z" fill="#FFFFFF"/><path d="M16 10v12" stroke="#6C5CE7" stroke-width="2"/><circle cx="16" cy="26" r="2" fill="#FFB020"/></svg>
      <span class="name">Open Sourcebook<span>.</span></span>
    </div>
    <h1>The open-source NotebookLM alternative with explainer videos.</h1>
    <p>Understand what you have to read.<br>Explain what you know.</p>
  </div>
  <div class="window"><img src="media/og-app.png" alt=""></div>
  <div class="clip"><img src="media/clip-blueprint.jpg" alt=""></div>
</body>
</html>
