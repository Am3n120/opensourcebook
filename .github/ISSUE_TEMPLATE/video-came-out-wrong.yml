name: A video came out wrong
description: A video was made but it is wrong, broken, unreadable or does not teach.
labels: ["video"]
body:
  - type: markdown
    attributes:
      value: |
        A bad video is worth a report. Please do not paste anything private: describe the source if you cannot share it.
  - type: textarea
    id: source
    attributes:
      label: The source text, or a description of it
      description: A passage, or what it was about and roughly how long it was.
    validations:
      required: true
  - type: input
    id: style
    attributes:
      label: The style
      description: Which one it used (for example flat, ink or neon), or "auto".
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which agent made it
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Other
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Your system
      description: For example macOS 15 on an Apple chip.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong
      description: What you saw, and at what time in the video. Drag a screenshot of the frame, or the video file, into this box.
    validations:
      required: true
