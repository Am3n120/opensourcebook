name: connector

on:
  push:
    paths:
      - "services/agent-connector/**"
      - ".github/workflows/connector.yml"
  pull_request:
    paths:
      - "services/agent-connector/**"
      - ".github/workflows/connector.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agent-connector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/agent-connector/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
