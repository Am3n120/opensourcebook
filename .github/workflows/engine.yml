name: engine

on:
  push:
    paths:
      - "engine/**"
      - "common/**"
      - ".github/workflows/engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - "common/**"
      - ".github/workflows/engine.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
