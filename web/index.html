<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open Sourcebook</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // The theme before anything is drawn (src/design/theme.ts does the same once the app runs). "re.theme" is the
      // name the choice was kept under before the app was called Open Sourcebook, read until the app has copied it
      // to the new name (src/app/oldStorage.ts).
      (function () {
        var choice = "system";
        try { choice = localStorage.getItem("opensourcebook.theme") || (localStorage.getItem("opensourcebook.carried") ? null : localStorage.getItem("re.theme")) || "system"; } catch (e) {}
        var dark = choice === "dark" || (choice !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
